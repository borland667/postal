name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          # Runner images only carry the newest patch release of each series,
          # so pin the series rather than 3.4.6.
          ruby-version: "3.4"
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop --format github
